name: Deploy Quiz App to GitHub Pages

on:
  push:
    branches:
      - feat/3-create-bootstrap-card

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/styles
          mkdir -p _site/fonts
          mkdir -p _site/img

          sed \
            -e 's#./node_modules/bootstrap/dist/css/bootstrap.min.css#./styles/bootstrap.min.css#' \
            -e 's#./node_modules/bootstrap-icons/font/bootstrap-icons.css#./fonts/bootstrap-icons.css#' \
            index.html > _site/index.html

          cp style.css script.js _site/
          cp -r scripts _site/

          cp node_modules/bootstrap/dist/css/bootstrap.min.css _site/styles/bootstrap.min.css
          cp node_modules/bootstrap-icons/font/bootstrap-icons.css _site/fonts/bootstrap-icons.css
          cp -r node_modules/bootstrap-icons/font/fonts _site/fonts/
          cp assets/img/bg-html.jpg _site/img/bg-html.jpg

      - name: Verify Pages artifact
        run: |
          test -f _site/styles/bootstrap.min.css
          test -f _site/fonts/bootstrap-icons.css
          test -f _site/img/bg-html.jpg
          grep 'bootstrap.min.css' _site/index.html
          grep 'bootstrap-icons.css' _site/index.html
          find _site -type f

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
