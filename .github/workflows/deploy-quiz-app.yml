name: Deploy Quiz App to GitHub Pages

on:
  push:
    branches:
      - feat/1-github-action-for-github-pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/node_modules/bootstrap/dist/css
          cp index.html style.css script.js _site/
          cp -r assets scripts _site/
          cp node_modules/bootstrap/dist/css/bootstrap.min.css \
            _site/node_modules/bootstrap/dist/css/bootstrap.min.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
