name: Deploy Quiz App to GitHub Pages

on:
  push:
    branches:
      - feat/6-add-subpages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/styles _site/fonts _site/assets _site/quizpages

          for file in index.html quizpages/*.html; do
            target="_site/$file"
            mkdir -p "$(dirname "$target")"
            sed \
              -e 's#\./node_modules/bootstrap/dist/css/bootstrap.min.css#./styles/bootstrap.min.css#g' \
              -e 's#\.\./node_modules/bootstrap/dist/css/bootstrap.min.css#../styles/bootstrap.min.css#g' \
              -e 's#\./node_modules/bootstrap-icons/font/bootstrap-icons.css#./fonts/bootstrap-icons.css#g' \
              -e 's#\.\./node_modules/bootstrap-icons/font/bootstrap-icons.css#../fonts/bootstrap-icons.css#g' \
              "$file" > "$target"
          done

          cp -r assets/. _site/assets/
          cp -r quizpages/. _site/quizpages/
          cp -r scripts/. _site/scripts/
          cp style.css script.js _site/

          cp node_modules/bootstrap/dist/css/bootstrap.min.css _site/styles/bootstrap.min.css
          cp node_modules/bootstrap-icons/font/bootstrap-icons.css _site/fonts/bootstrap-icons.css
          cp -r node_modules/bootstrap-icons/font/fonts _site/fonts/

      - name: Verify Pages artifact
        run: |
          test -f _site/index.html
          test -f _site/quizpages/html-quiz.html
          test -f _site/quizpages/css-quiz.html
          test -f _site/quizpages/javascript-quiz.html
          test -f _site/styles/bootstrap.min.css
          test -f _site/fonts/bootstrap-icons.css
          test -f _site/assets/img/bg-html.jpg
          test -f _site/assets/img/bg-css.jpg
          test -f _site/assets/img/bg-javascript.jpg
          grep 'bootstrap.min.css' _site/index.html
          grep 'bootstrap-icons.css' _site/index.html
          find _site -type f

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
